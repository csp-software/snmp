<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S N M Polytechnic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-start pt-6 sm:pt-10 px-4 pb-8">

  <!-- Main Container -->
  <div id="mainCard" class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden transition-all duration-300">
    
    <!-- Header -->
    <div class="bg-indigo-600 px-6 py-5 text-white text-center">
      <h1 id="headerTitle" class="text-xl font-bold tracking-tight">Digital Work Space</h1>
      <p id="headerSub" class="text-xs text-indigo-100 mt-1">Pay the fee to unlock your form</p>
    </div>

    <!-- Step 1: Payment Interface -->
    <div id="paymentSection" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Full Name</label>
        <input type="text" id="participantName" required placeholder="Enter full name" 
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Choose Event</label>
        <select id="eventSelect" required onchange="onEventChange()" 
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="" disabled selected>Loading events...</option>
        </select>
      </div>

      <div id="eventDetails" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-2">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500">Registration Fee:</span>
          <span id="displayAmount" class="font-bold text-indigo-600 text-base">₹0</span>
        </div>
        <p id="displayDesc" class="text-xs text-slate-500 italic border-t border-slate-200 pt-2"></p>
      </div>

      <button type="button" id="payBtn" onclick="initiatePayment()" disabled
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-semibold rounded-lg shadow-md transition duration-150 flex items-center justify-center space-x-2 text-sm">
        <span>Proceed to Pay</span>
      </button>

      <div id="statusMsg" class="hidden text-center text-xs py-2.5 px-3 rounded-lg font-medium"></div>
    </div>

    <!-- Step 2: Unlocked Form (Hidden until verified) -->
    <div id="formSection" class="hidden p-4">
      <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded-lg mb-3 flex items-center justify-between text-xs">
        <div>
          <span class="font-bold">Payment Verified</span>
          <p id="confirmedPaymentId" class="text-[11px] text-emerald-600 font-mono"></p>
        </div>
        <span class="px-2 py-1 bg-emerald-200 text-emerald-900 rounded font-semibold text-[10px]">PAID</span>
      </div>

      <!-- Google Form Container & Progress Spinner -->
      <div class="relative w-full rounded-lg overflow-hidden border border-slate-200" style="height: 650px;">
        <div id="loadingOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-20 flex flex-col items-center justify-center space-y-3">
          <svg class="animate-spin h-9 w-9 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <div class="text-center">
            <p class="text-sm font-semibold text-slate-800">Please wait...</p>
            <p class="text-xs text-slate-500">Preparing and loading your registration form</p>
          </div>
        </div>

        <iframe id="googleFormIframe" src="" onload="onIframeLoaded()" class="w-full h-full border-0" frameborder="0" marginheight="0" marginwidth="0">
          Loading form...
        </iframe>
      </div>
    </div>

    <!-- Footer inside the card -->
    <div class="border-t border-slate-100 bg-slate-50/70 py-3 text-center">
      <p class="text-[11px] font-medium tracking-wide text-slate-400">
        Designed by: <span class="font-semibold text-slate-600">C S Pradeep Kumar</span>
      </p>
    </div>

  </div>

  <script>
    // 1. PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbyqAJPTfi8sHYnBupn569xO1haxh1EmMHRIqBSHjVAyXsGx0HNR90ZWUtG8GPz9pH6sRQ/exec";

    // 2. YOUR RAZORPAY LIVE KEY
    const RAZORPAY_KEY = "rzp_live_TcY9c9L9FCC2vQ";

    let eventsData = [];
    let selectedEvent = null;
    let isFormTriggered = false;

    window.onload = function() {
      fetch(SCRIPT_API_URL)
        .then(res => res.json())
        .then(data => populateDropdown(data))
        .catch(() => {
          showMessage("Failed to load events from the sheet. Check script deployment.", "error");
        });
    };

    function populateDropdown(data) {
      eventsData = data;
      const select = document.getElementById('eventSelect');
      select.innerHTML = '<option value="" disabled selected>Select an activity</option>';

      data.forEach((evt, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${evt.name} (₹${evt.amount})`;
        select.appendChild(opt);
      });
    }

    function onEventChange() {
      const idx = document.getElementById('eventSelect').value;
      selectedEvent = eventsData[idx];

      if (selectedEvent) {
        document.getElementById('displayAmount').textContent = '₹' + selectedEvent.amount;
        document.getElementById('displayDesc').textContent = selectedEvent.description || "No description provided.";
        document.getElementById('eventDetails').classList.remove('hidden');
        document.getElementById('payBtn').disabled = false;
      }
    }

    function initiatePayment() {
      const name = document.getElementById('participantName').value.trim();
      if (!name) {
        showMessage("Please enter your full name first.", "error");
        return;
      }

      if (!selectedEvent) return;

      const options = {
        key: RAZORPAY_KEY,
        amount: selectedEvent.amount * 100, // Amount in paise
        currency: "INR",
        name: "S N M Polytechnic",
        description: selectedEvent.name,
        prefill: { name: name },
        theme: { color: "#4f46e5" },
        handler: function(response) {
          handleSuccess(name, selectedEvent, response.razorpay_payment_id);
        },
        modal: {
          ondismiss: function() {
            showMessage("Payment cancelled.", "error");
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }

    function handleSuccess(name, evt, paymentId) {
      // Log payment to Google Sheets via POST
      fetch(SCRIPT_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name,
          activity: evt.name,
          amount: evt.amount,
          paymentId: paymentId
        })
      });

      // Hide payment fields
      document.getElementById('paymentSection').classList.add('hidden');

      // Update Header
      document.getElementById('headerTitle').textContent = evt.name;
      document.getElementById('headerSub').textContent = "Fill out the registration form below";

      // Show loader overlay
      document.getElementById('loadingOverlay').classList.remove('hidden');

      // Prepare Google Form URL for embedding
      let embedUrl = evt.formLink;
      if (embedUrl.indexOf('?') > -1) {
        embedUrl += '&embedded=true';
      } else {
        embedUrl += '?embedded=true';
      }

      document.getElementById('confirmedPaymentId').textContent = "Ref: " + paymentId;

      // Expand card width to accommodate form
      const card = document.getElementById('mainCard');
      card.classList.remove('max-w-lg');
      card.classList.add('max-w-2xl');

      // Reveal form section and load iframe
      document.getElementById('formSection').classList.remove('hidden');
      isFormTriggered = true;
      document.getElementById('googleFormIframe').src = embedUrl;
    }

    function onIframeLoaded() {
      if (isFormTriggered) {
        setTimeout(() => {
          document.getElementById('loadingOverlay').classList.add('hidden');
        }, 500);
      }
    }

    function showMessage(msg, type) {
      const el = document.getElementById('statusMsg');
      el.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'bg-rose-50', 'text-rose-700');
      if (type === 'success') {
        el.classList.add('bg-emerald-50', 'text-emerald-700');
      } else {
        el.classList.add('bg-rose-50', 'text-rose-700');
      }
      el.textContent = msg;
    }
  </script>
</body>
</html>
